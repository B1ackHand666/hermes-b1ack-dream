name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-unit:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run build:plugin
      - run: npm test
      - run: npm run test:python

  hermes-contract:
    name: Ubuntu Hermes contract / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: fd3a783a3edbbda611cbc4e38d70202dca7b5852
          path: .ci/hermes-agent
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked --python 3.11 --extra dev
        working-directory: .ci/hermes-agent
      - run: npm ci
      - run: npm run build:plugin
      - run: .ci/hermes-agent/.venv/bin/python scripts/test_hermes_provider.py --hermes-source "$GITHUB_WORKSPACE/.ci/hermes-agent"
      - run: .ci/hermes-agent/.venv/bin/python scripts/test_hermes_dashboard.py --hermes-source "$GITHUB_WORKSPACE/.ci/hermes-agent"

  latest-hermes-compatibility:
    name: Informational latest Hermes main compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .ci/hermes-agent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked --python 3.11 --extra dev
        working-directory: .ci/hermes-agent
      - run: npm ci
      - run: npm run build:plugin
      - run: .ci/hermes-agent/.venv/bin/python scripts/test_hermes_provider.py --hermes-source "$GITHUB_WORKSPACE/.ci/hermes-agent"
      - run: .ci/hermes-agent/.venv/bin/python scripts/test_hermes_dashboard.py --hermes-source "$GITHUB_WORKSPACE/.ci/hermes-agent"
